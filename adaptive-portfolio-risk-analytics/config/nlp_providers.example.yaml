rbi:
  enabled: false
  mode: local_manifest
  local_manifest_path: data/sentiment/rbi_real/manifest.csv
  feed_urls:
    - https://www.rbi.org.in/pressreleases_rss.xml
    - https://www.rbi.org.in/Publication_rss.xml
    - https://www.rbi.org.in/speeches_rss.xml

earnings:
  enabled: true
  mode: local_manifest
  local_manifest_path: data/sentiment/earnings_calls/manifest.csv

gdelt:
  enabled: false
  mode: api
  queries:
    - "India inflation RBI"
    - "India rate hike RBI"
    - "India geopolitical risk"
    - "oil price shock India"
    - "India banking stress"
  max_records_per_query: 50
  request_delay_seconds: 6
  retry_delay_seconds: 10
  max_retries: 3
  timeout_seconds: 30

alpha_vantage:
  enabled: false
  mode: api
  api_key_env: ALPHAVANTAGE_API_KEY
  tickers:
    - NIFTYBEES.NS
    - BANKBEES.NS
    - INFY.NS
    - RELIANCE.NS
  max_records: 100

scoring:
  method: lexicon
  finbert_enabled: false
  finbert_model: ProsusAI/finbert

validation:
  decision_lag_days: 1
  min_coverage_ratio: 0.20
  min_records: 50
  min_distinct_dates: 20
  max_reaction_warning_rate: 0.25
