[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = 'black'
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = []

[tool.mypy]
python_version = '3.10'
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ['adaptive-portfolio-risk-analytics/tests']
addopts = "-v --strict-markers --tb=short"
markers = [
  "integration: Integration tests",
  "slow: Slow running tests",
  "unit: Unit tests",
]

